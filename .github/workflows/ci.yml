name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: moon fmt --check
      - name: Type check
        run: moon check
      - name: Run tests
        run: moon test
      - name: Verify MVP workflow
        run: |
          output=$(moon run cmd/main -- --text "contact=alice@example.com password=demo-secret")
          echo "$output"
          echo "$output" | grep -F "findings: 2"
          echo "$output" | grep -F "contact=al************com password=[SECRET]"
          json=$(moon run cmd/main -- --text "contact=alice@example.com" --json)
          echo "$json" | grep -F '"total":1'
          echo "$json" | grep -F '"detector":"email"'
          echo "$json" | jq -e '.summary.total == 1 and .findings[0].detector == "email"' > /dev/null
          redacted=$(moon run cmd/main -- --text "password=demo-secret" --redacted-only)
          test "$redacted" = 'password=[SECRET]'
          if echo "$redacted" | grep -F 'demo-secret'; then
            echo 'Unredacted sample secret appeared in CLI output' >&2
            exit 1
          fi
      - name: Build release
        run: moon build --release
      - name: Package dry run
        run: moon package

