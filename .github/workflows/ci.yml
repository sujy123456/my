name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: moon fmt --check
      - name: Type check
        run: moon check
      - name: Run tests
        run: moon test
      - name: Verify MVP workflow
        run: |
          output=$(moon run cmd/main -- --text "contact=alice@example.com password=demo-secret")
          echo "$output"
          echo "$output" | grep -F "findings: 2"
          echo "$output" | grep -F "contact=al************com password=[SECRET]"
          json=$(moon run cmd/main -- --text "contact=alice@example.com" --json)
          echo "$json" | grep -F '"total":1'
          echo "$json" | grep -F '"detector":"email"'
      - name: Build release
        run: moon build --release
      - name: Package dry run
        run: moon package

